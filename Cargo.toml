[package]
name = "openadserver"
version = "0.1.0"
edition = "2021"
authors = ["OpenAdServer Team"]
description = "OpenAdServer / LiteAds - High performance computational advertising system in Rust"
license = "Apache-2.0"
readme = "README.md"
keywords = ["advertising", "recommendation", "ctr", "adserver", "machine-learning"]

[[bin]]
name = "openadserver"
path = "src/main.rs"

[lib]
name = "openadserver"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["json", "query"] }
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Database & Cache
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "bigdecimal", "macros"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "aio"] }
bigdecimal = { version = "0.4", features = ["serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.13", features = ["process"] }

# Utilities
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.8"
thiserror = "2.0"
anyhow = "1.0"
md-5 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

